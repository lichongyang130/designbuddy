<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美化 · DesignBuddy</title><link rel="stylesheet" href="/office-workspace/workspace.css"></head><body>
<div class="app"><header class="top"><div class="logo">✳</div><div><strong>美化 · 智能办公</strong><small>你的工作，从这里开始</small></div><div class="top-space"></div><span class="secure">◉ 本地优先</span><a href="/index.html" target="_blank" rel="noopener">返回原工具 ↗</a></header>
<main class="layout"><div class="intro"><h1>你想做什么？</h1><p>选一项工作，直接开始。不需要先学习操作流程。</p></div>
<div class="quick-grid" id="quickGrid" aria-label="选择工作"></div>
<details class="ask-box" id="askBox"><summary>或者，告诉我你的需求 <span>＋</span></summary><section class="composer" aria-label="工作目标"><textarea id="goal" maxlength="4000" rows="2" placeholder="例如：合并各部门预算表，检查重复并生成图表"></textarea><div class="composer-bottom"><div class="file-actions"><button id="pickFiles" type="button" class="subtle">＋ 添加文件</button><button id="pickFolder" type="button" class="text-btn">选择文件夹</button><input id="files" type="file" multiple hidden><input id="folder" type="file" webkitdirectory multiple hidden><span id="fileCount">未添加文件</span></div><button id="start" type="button" class="primary">开始 <span>→</span></button></div><div class="file-list" id="selectedFiles"></div></section><p class="privacy-note">按关键词建议工作类型，不是 AI 自动理解。选择的文件不会自动上传。</p></details><div class="session-files" id="sessionFiles" hidden><div><strong>已选文件</strong><span>当前页面会话有效，刷新后需重新选择</span></div><div id="visibleFiles" class="file-list"></div><button type="button" class="text-btn" id="moreFiles">＋ 添加文件</button></div><p id="status" class="status" role="status" aria-live="polite"></p>
<section id="choice" class="card" hidden><div class="card-head"><div><h2>你想先处理哪一项？</h2><p>根据关键词提供建议，并非 AI 自动理解。可自行选择。</p></div></div><div class="choice-list" id="choices"></div></section>
<section id="workspace" class="workspace" hidden><div class="workspace-head"><div><h2 id="workTitle"></h2><p id="workSubtitle"></p></div><button class="text-btn" type="button" id="closeWork">收起 ×</button></div><div id="beautifyPanel" class="panel" hidden></div><div id="pptPanel" class="panel" hidden></div><div id="searchPanel" class="panel" hidden></div><div id="excelPanel" class="panel" hidden></div><div id="wordPanel" class="panel" hidden></div><div id="collectionPanel" class="panel" hidden></div><div id="tasksPanel" class="panel" hidden></div><div id="reviewPanel" class="panel" hidden></div><div id="crossreviewPanel" class="panel" hidden></div></section>
<footer><span>文件按需处理 · 收集任务保存于本机 · 重要内容请人工确认</span></footer></main></div><script src="/vendor/excel-buddy/exceljs.min.js"></script><script type="module" src="/office-workspace/workspace.js"></script></body></html>
