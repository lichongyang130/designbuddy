<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欢迎页设计 · DesignBuddy</title><style>@font-face{font-family:WelcomeSans;src:url('assets/NotoSansSC.ttf');font-display:swap}*{box-sizing:border-box}body{margin:0;background:#eaece8;color:#343b31;font-family:WelcomeSans,Arial,sans-serif}a{color:inherit;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 28px;background:#fbfcf9;border-bottom:1px solid #dbe0d3;position:sticky;top:0;z-index:2;font-size:12px}header a{white-space:nowrap}nav{display:flex;gap:22px;align-items:center}.name{text-align:center;font-size:13px}.name small{font-size:10px;color:#9aa38f;margin-left:12px}main{max-width:1500px;padding:28px;margin:auto}img{display:block;width:100%;box-shadow:0 15px 55px #2735251a;border-radius:10px}p{font-size:12px;color:#8b9580;line-height:1.9;margin:22px 2px 0}a:focus-visible{outline:3px solid #897bc2;outline-offset:4px}@media(max-width:700px){header{flex-wrap:wrap;padding:15px 18px;gap:15px}.name{order:-1;width:100%;text-align:left}.name small{font-size:9px}main{padding:12px}nav{gap:17px;font-size:11px}p{font-size:11px}}
</style></head><body><header><a href="index.html">← 返回 15 套方案</a><div class="name" id="name"></div><nav><a id="prev">← 上一套</a><a id="next">下一套 →</a><a id="download" download>下载 PNG ↓</a></nav></header><main><img id="image" alt="首次欢迎页设计稿"><p id="note"></p></main><script src="concepts.js?rev=5efaad428655"></script><script>
const id=Math.max(1,Math.min(15,Number(new URLSearchParams(location.search).get('v'))||1)),c=WELCOME_CONCEPTS[id-1],file='png/'+encodeURIComponent(String(id).padStart(2,'0')+'-'+c.name+'.png'),available=WELCOME_CONCEPTS.filter(e=>e.art),at=available.findIndex(e=>e.id===id);
if(c.art){document.getElementById('image').src=file+'?rev=2-final';document.getElementById('image').alt=`方案 ${id} ${c.name} · 新主视觉：${c.artLabel}`;document.getElementById('download').href=file;document.getElementById('download').download='DesignBuddy-welcome-v2-'+String(id).padStart(2,'0')+'.png'}
else{document.getElementById('image').remove();document.getElementById('download').remove();const p=document.createElement('p');p.textContent='此套主视觉尚待生成。没有使用旧图或重复图替代。';document.querySelector('main').prepend(p)}
document.getElementById('name').innerHTML=`${String(id).padStart(2,'0')} / ${c.name}<small>${c.art?'V2 新主视觉 · 1440 × 1000':'新主视觉待生成'}</small>`;
document.getElementById('prev').href='viewer.html?v='+available[at<=0?available.length-1:at-1].id;document.getElementById('next').href='viewer.html?v='+available[at<0||at===available.length-1?0:at+1].id;
document.getElementById('note').textContent=c.note+(c.art?' 新主视觉为本轮 AI 生成：'+c.artLabel+'。':' 11—15 套待下一轮生成。')+' 此为设计稿，未接入真实登录或模型连接功能。';document.title=`${String(id).padStart(2,'0')} ${c.name} · DesignBuddy`;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')location.href=document.getElementById('prev').href;if(e.key==='ArrowRight')location.href=document.getElementById('next').href});
</script></body></html>
