<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DesignBuddy · 欢迎页设计稿</title><link rel="stylesheet" href="concept.css"></head><body><div id="app"></div><div id="toast" role="status"></div><script src="concepts.js?rev=5efaad428655"></script><script>
const id=Math.max(1,Math.min(15,Number(new URLSearchParams(location.search).get('v'))||1)),c=WELCOME_CONCEPTS[id-1];
const icon=(name)=>{const paths={spark:'M12 2 14.7 9.3 22 12 14.7 14.7 12 22 9.3 14.7 2 12 9.3 9.3Z',arrow:'M5 12h14m-6-6 6 6-6 6',local:'M8 6h8a4 4 0 0 1 4 4v7H4v-7a4 4 0 0 1 4-4ZM12 2v4M8 11h.01M16 11h.01M8 21h8M1 11v3m22-3v3',key:'M14 7a5 5 0 1 1-2 4L3 20l-1-4 9-9a5 5 0 0 1 3 0Z',globe:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM3 12h18M12 3c5 6 5 12 0 18-5-6-5-12 0-18Z',panel:'M3 5h18v14H3ZM9 5v14',search:'m16 16 5 5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.spark}"/></svg>`};
const brand=`<div class="brand"><span class="mark">${icon('spark')}</span><span>DesignBuddy</span></div>`;
const footer=`<footer class="footer"><button class="language">${icon('globe')} 简体中文 <span>⌄</span></button><p>DesignBuddy · 让灵感变成设计</p></footer>`;
const art=`<figure class="art ${c.art?'':'pending'}">${c.art?`<img src="${c.art}" alt="新生成艺术主视觉：${c.artLabel}">`:`<div class="pending-note">主视觉待生成<br><small>方案 ${String(c.id).padStart(2,'0')}</small></div>`}<figcaption><span>ART MEETS POSSIBILITY</span><strong>让灵感，成为作品。</strong><small>DesignBuddy / Creative Space</small></figcaption></figure>`;
const methods=`<div class="divider"><span>或使用自己的 AI</span></div><div class="methods"><button class="method">${icon('local')}<span><b>本地 AI</b><small>连接你的设备</small></span><i>↗</i></button><button class="method">${icon('key')}<span><b>API 密钥</b><small>使用你的模型</small></span><i>↗</i></button></div>`;
const copy=`<section class="copy">${brand}<div class="body"><p class="eyebrow">${c.eyebrow}</p><h1>${c.title}</h1><p class="description">${c.desc}</p><button class="primary"><span>登录 / 注册</span>${icon('arrow')}</button>${methods}<div class="micro-notes"><span>灵感</span><em>—</em><span>设计</span><em>—</em><span>表达</span></div></div>${footer}</section>`;
const rail=id===10?`<aside class="rail"><span class="rail-mark">${icon('spark')}</span><div><p class="current"><b>01</b>欢迎</p><p><b>02</b>选择方式</p><p><b>03</b>开始创作</p></div><span class="rail-foot">DESIGN<br>BUDDY.</span></aside>`:'';
document.getElementById('app').innerHTML=`<main class="window v${id}"><header class="chrome"><div class="traffic"><i></i><i></i><i></i></div><div class="window-tools">${icon('panel')}${icon('search')}</div><span>DesignBuddy</span></header><div class="canvas">${rail}${copy}${art}</div></main>`;
document.title=`${String(id).padStart(2,'0')} ${c.name} · DesignBuddy`;
let timer;document.addEventListener('click',event=>{if(!event.target.closest('button'))return;const t=document.getElementById('toast');t.textContent='这是设计稿，暂不执行登录或模型连接操作。';t.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('visible'),2500)});
</script></body></html>
