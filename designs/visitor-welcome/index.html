flow:hidden;border:1px solid #e2e3da;background:#eeeee7;aspect-ratio:1.44;transition:transform .2s,box-shadow .2s}.preview[aria-disabled=true]{cursor:default}.preview[aria-disabled=true]:hover{transform:none;box-shadow:none}.preview:hover{transform:translateY(-5px);box-shadow:0 14px 30px #36422612}.preview img{width:100%;height:100%;object-fit:contain;display:block}.details{padding:16px 3px 0}.title{display:flex;align-items:center;gap:10px}.number{font-size:10px;color:#a0a38f;font-family:Arial,sans-serif;letter-spacing:1px}.title h2{font-size:15px;margin:0;font-weight:500}.tag{font-size:9px;background:#e8ebde;color:#788a59;border-radius:4px;padding:4px 7px;margin-left:auto}.details p{font-size:11px;color:#95998c;line-height:1.9;margin:9px 0 0}.bottom{margin-top:54px;padding-top:24px;border-top:1px solid #dfdfd5;display:flex;justify-content:space-between;gap:35px;font-size:10px;color:#9a9e8e;line-height:1.9}.loading{display:grid;place-items:center;height:100%;font-size:12px;color:#9c9e91}.card[hidden]{display:none}.empty{padding:60px;color:#999;text-align:center}a:focus-visible,button:focus-visible{outline:3px solid #897bc2;outline-offset:4px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{align-items:start;flex-direction:column;gap:24px}.main{padding:40px 25px}.top{padding:0 25px}.toolbar{margin-top:34px}h1{font-size:36px}}@media(max-width:600px){.grid{grid-template-columns:1fr;gap:30px}.logo span{display:none}.top{height:65px}.status{font-size:9px}.filters{gap:0}.filters button{padding:8px 12px;font-size:11px}.count{font-size:9px}.toolbar{align-items:flex-start;gap:12px;flex-direction:column}h1{font-size:30px}.intro p{font-size:12px}.bottom{flex-direction:column;gap:10px}.main{padding:36px 18px}}
</style></head><body><header class="top"><a class="logo" href="index.html">DesignBuddy<span>WELCOME EXPLORATIONS</span></a><div class="status" id="status">设计方向 · 15 套</div><button id="retry" hidden>重新加载</button></header><main class="main"><p class="eyebrow">FIRST IMPRESSION / 2026.10</p><div class="intro"><section><h1>15 种方式，<br><span>遇见你的下一件作品。</span></h1><p>第二轮保留 15 套布局，为每套重新生成不同的艺术主视觉。01—15 已全部换上不同的新图，不复用旧画作或重复图片充数。</p></section><a class="download" id="download" href="DesignBuddy-welcome-v2-all15.zip" download="DesignBuddy-welcome-v2-all15.zip" aria-disabled="true">下载全部 15 张新版设计图 <span>↓</span></a></div><div class="toolbar"><nav class="filters" aria-label="筛选设计方向"></nav><span class="count" role="status">15 套设计 · 1440 × 1000</span></div><div class="grid" id="grid"></div><footer class="bottom"><span>01 蓝衣与金色花束 · 03 荧光蜂鸟 · 05 紫色云端建筑<br>推荐为设计判断，不代表实际功能或画质测试结果。</span><span>此画廊为设计稿 · 07 已实现为应用欢迎页<br>新主视觉为本轮 AI 生成；旧版 15 张另行归档。</span></footer></main><script src="concepts.js?rev=5efaad428655"></script><script>
let ready=false,loadError=false,completed=new Map(),filter='全部';const categories=['全部','经典','艺术','极简','沉浸'];
function render(){document.querySelector('.filters').innerHTML=categories.map(t=>`<button class="${t===filter?'active':''}" aria-pressed="${t===filter}" data-filter="${t}">${t}</button>`).join('');document.getElementById('grid').innerHTML=WELCOME_CONCEPTS.filter(c=>filter==='全部'||c.category===filter).map(c=>`<article class="card"><a class="preview" href="${ready&&completed.has(c.id)?'viewer.html?v='+c.id:'#'}" aria-label="查看方案 ${c.id} ${c.name}" aria-disabled="${!ready||!completed.has(c.id)}">${ready&&completed.has(c.id)?`<img src="thumb/${String(c.id).padStart(2,'0')}.webp?rev=2-final" alt="方案 ${c.id} ${c.name}，${c.note}" loading="lazy">`:`<div class="loading">${loadError?'图片加载失败，请点击上方重新加载':'正在加载已完成的设计图…'}</div>`}</a><div class="details"><div class="title"><span class="number">${String(c.id).padStart(2,'0')}</span><h2>${c.name}</h2>${c.tag?`<span class="tag">${c.tag}</span>`:''}</div><p>${c.note}${c.artLabel?' 新图：'+c.artLabel+'。':''}</p></div></article>`).join('');document.querySelector('.count').textContent=`${WELCOME_CONCEPTS.filter(c=>filter==='全部'||c.category===filter).length} 套设计 · 1440 × 1000`;}
document.addEventListener('click',e=>{if(e.target.closest('#retry')){check();return}if(e.target.closest('[aria-disabled="true"]')){e.preventDefault();return}const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}});
async function check(){
 loadError=false;document.getElementById('retry').hidden=true;
 try{
  const r=await fetch('manifest.json',{cache:'no-store'});if(!r.ok)throw new Error('Manifest unavailable');
  const m=await r.json();
  if(!m.ready||!m.complete||!Array.isArray(m.images))throw new Error('Incomplete manifest');
  const files=new Map();
  for(const c of WELCOME_CONCEPTS){const image=m.images.find(i=>i.file==='png/'+String(c.id).padStart(2,'0')+'-'+c.name+'.png');if(image)files.set(c.id,image.file)}
  if(files.size!==15)throw new Error('Missing completed designs');
  completed=files;ready=true;
  document.getElementById('status').textContent='15 套全部已换新图';
  const download=document.getElementById('download');download.href=m.archive;download.download=m.archive;download.innerHTML='下载全部 15 张新版设计图 <span>↓</span>';download.setAttribute('aria-disabled','false');
 }catch(error){ready=false;loadError=true;document.getElementById('status').textContent='设计图加载失败，请重新加载';document.getElementById('retry').hidden=false;document.getElementById('download').setAttribute('aria-disabled','true')}
 render();
}
render();check();
</script></body></html>
