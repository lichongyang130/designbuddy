name: DesignBuddy CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Unit, Backend, Skills, Registry & Playwright Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack & setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Setup pnpm 9
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Provision offline FFmpeg & ASR model
        run: |
          pnpm setup:ffmpeg
          pnpm setup:asr

      - name: Install Chromium for Playwright
        run: pnpm --filter designbuddy-web exec playwright install --with-deps chromium

      - name: TypeScript & architecture/status registry checks
        run: pnpm check

      - name: Run unit, backend API, Agent Core, and skill runtime tests
        run: |
          pnpm test
          pnpm test:skills

      - name: Build server, web bundle, and desktop stage bundle
        run: pnpm stage:desktop

      - name: Start local daemon + Vite dev server and run Playwright core suite
        env:
          FFMPEG_PATH: ${{ github.workspace }}/node_modules/.cache/ffmpeg/ffmpeg
          HOST: 0.0.0.0
          PORT: 8787
        run: |
          node dist/local/server/local-daemon.js > /tmp/designbuddy-daemon.log 2>&1 &
          DAEMON_PID=$!
          pnpm --filter designbuddy-web exec vite --host 0.0.0.0 --port 5173 --strictPort > /tmp/designbuddy-vite.log 2>&1 &
          VITE_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null && curl -fsS http://127.0.0.1:5173 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health
          pnpm test:e2e:core
          kill $VITE_PID $DAEMON_PID || true

      - name: Upload test results and desktop stage manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designbuddy-ci-evidence
          if-no-files-found: ignore
          path: |
            apps/desktop/dist/stage-manifest.json
            apps/web/test-results/
            /tmp/designbuddy-daemon.log
            /tmp/designbuddy-vite.log
